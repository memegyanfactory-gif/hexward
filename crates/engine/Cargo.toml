[package]
name = "hexward-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cfb = "0.16.0"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
flate2 = "1.1.11"
goblin = "0.10.7"
hex = "0.4.3"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = "0.25.0"
sha2 = "0.10.9"
sysinfo = "0.40.1"
tar = "0.4.46"
thiserror = "2.0.21"
walkdir = "2.5.0"
yara-x = "1.23.0"
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_RestartManager", "Win32_System_Services", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Foundation"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
