[package]
name = "hexward-amsi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Hexward's AMSI provider: hands scripts that are about to run to the Hexward app for a verdict"

[lib]
name = "hexward_amsi"
crate-type = ["cdylib"]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Com", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_Security"] }
