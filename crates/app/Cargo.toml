[package]
name = "hexward-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7"
hexward-engine = { version = "0.1.0", path = "../engine" }
hexward-update = { version = "0.1.0", path = "../update" }
notify = "8.2.1"
notify-rust = "4.18.2"
png = "0.18.1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", features = ["unstable-winit-030", "software-renderer-systemfonts"] }
sysinfo = "0.40"
tray-icon = "0.26.1"

[build-dependencies]
embed-resource = "3.0.12"
ico = "0.6.0"
slint-build = "1.18.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
