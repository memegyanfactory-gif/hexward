# Every push to main: test. If the version in Cargo.toml has no release yet:
# build, sign with the release key, and publish a GitHub Release. Installed apps see it
# within 6 hours (or at once with "Check for updates") and install it after verifying the signature.
#
# To ship an update: bump [workspace.package] version in Cargo.toml, add a CHANGELOG.md section, push.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      # Pinned to a commit, never a movable tag (see the tj-actions/changed-files compromise).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version
        id: v
        shell: bash
        run: |
          v=$(grep -m1 -E '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$v" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$v is already released; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Test
        run: cargo test --workspace --locked

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Every release must stay silent on clean software: Windows itself plus everything
      # installed on the runner (SDKs, compilers, browsers). One confirmed hit blocks the release.
      - name: False-alarm gate
        shell: pwsh
        run: |
          cargo build --release --locked -p hexward
          ./target/release/hexward.exe update
          ./target/release/hexward.exe scan C:\Windows\System32 "C:\Program Files" --json --no-cache > fp.json
          $j = Get-Content fp.json -Raw | ConvertFrom-Json
          $s = $j.summary
          $confirmed = @($s.threats | Where-Object { @($_.detections | Where-Object { $_.source -in @('hash', 'rule', 'eicar') }).Count -gt 0 })
          $suspicious = @($s.threats).Count - $confirmed.Count
          $report = @(
            "## False-alarm gate",
            "",
            "| Files checked | Data | Confirmed hits | Suspicious |",
            "|---|---|---|---|",
            "| $($s.files_scanned) | $([math]::Round($s.bytes_scanned / 1GB, 1)) GB | $($confirmed.Count) | $suspicious |",
            ""
          )
          foreach ($t in @($s.threats)) { $report += "- ``$($t.detections[0].name)`` · $($t.path) $(if ($t.detections[0].inner) { '› ' + $t.detections[0].inner })" }
          $report -join "`n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($confirmed.Count -gt 0) {
            Write-Host "::error::$($confirmed.Count) confirmed detections on clean software. Fix the rule or add it to rules/disabled.txt."
            exit 1
          }
          exit 0

      # Popular installers and game launchers, fresh from their official sources: packed
      # installers are where antivirus false alarms happen.
      - name: Clean installers gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/clean-corpus.ps1 -Hexward ./target/release/hexward.exe

      # Harmless samples of every threat type must be caught (AMTSO-style self-test).
      - name: Self-test
        shell: pwsh
        run: ./scripts/selftest.ps1 -Hexward ./target/release/hexward.exe -Out selftest.md

      - name: Build
        if: steps.v.outputs.exists == 'false'
        run: cargo build --release --locked -p hexward-app -p hexward -p hexward-release -p hexward-amsi

      - name: Sign
        if: steps.v.outputs.exists == 'false'
        shell: bash
        env:
          HEXWARD_SIGNING_KEY: ${{ secrets.HEXWARD_SIGNING_KEY }}
        run: |
          if [ -z "$HEXWARD_SIGNING_KEY" ]; then echo "::error::HEXWARD_SIGNING_KEY secret is missing; refusing to publish an unsigned release"; exit 1; fi
          v="${{ steps.v.outputs.version }}"
          mkdir dist
          cp target/release/hexward-app.exe target/release/hexward.exe target/release/hexward_amsi.dll dist/
          ./target/release/hexward-release.exe sign dist/hexward-app.exe --version "$v"
          ./target/release/hexward-release.exe sign dist/hexward.exe --version "$v"
          ./target/release/hexward-release.exe sign dist/hexward_amsi.dll --version "$v"
          (cd dist && sha256sum hexward-app.exe hexward.exe hexward_amsi.dll > SHA256SUMS.txt)

      - name: Release notes
        if: steps.v.outputs.exists == 'false'
        shell: bash
        run: |
          v="${{ steps.v.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then echo "Hexward $v" > notes.md; fi
          printf '\n---\nSigned with the Hexward release key. The app verifies the signature before installing.\n' >> notes.md

      - name: Publish
        if: steps.v.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          gh release create "v$v" dist/hexward-app.exe dist/hexward-app.exe.sig dist/hexward.exe dist/hexward.exe.sig dist/hexward_amsi.dll dist/hexward_amsi.dll.sig dist/SHA256SUMS.txt \
            --title "Hexward $v" --notes-file notes.md --target "$GITHUB_SHA"
