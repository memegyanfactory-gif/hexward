[workspace]
resolver = "3"
members = ["crates/engine", "crates/cli", "crates/app", "crates/update", "crates/release"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/<org>/hexward"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2
